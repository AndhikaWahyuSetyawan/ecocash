version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ecocash-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecocash
      DB_USERNAME: ecocash
      DB_PASSWORD: secret
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    command: >
      sh -lc "php artisan migrate --force; php artisan db:seed --force || true; php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: ecocash-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.4
    container_name: ecocash-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecocash
      MYSQL_USER: ecocash
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ecocash-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  storage_data:
  bootstrap_cache:
